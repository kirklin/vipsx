name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # libvips headers use -Xpreprocessor, which cgo refuses to pass on unless told.
  CGO_CFLAGS_ALLOW: -Xpreprocessor

jobs:
  # The claim this project makes is that one copy of the code works against
  # whatever libvips is installed. That is only worth believing if it is tested
  # against several, so the matrix spans real versions rather than several
  # runners with the same one.
  #
  # The floor is tested separately, in a container, because no GitHub runner
  # ships it. See test-floor below.
  test:
    name: test (${{ matrix.os }}, libvips from ${{ matrix.source }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            source: apt (8.15)
          - os: macos-14
            source: brew (8.18)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install libvips (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvips-dev libvips-tools pkg-config

      - name: Install libvips (macOS)
        if: runner.os == 'macOS'
        run: brew install vips pkg-config

      - name: Report the libvips actually linked
        run: |
          pkg-config --modversion vips
          vips --version

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # site/ holds the demonstration page. It carries its own go.mod so the go
      # command treats it as a separate module and leaves its images out of the
      # module zip; without that, every `go get` would pull down a megabyte of
      # screenshots.
      - name: The demo images must stay out of the module
        run: make check-module-size

      - name: Unit tests
        run: go test ./vips/ -count=1

      - name: Coverage against govips and vipsgen
        run: go test ./internal/coverage/ -count=1 -v

      - name: Race detector
        run: go test ./vips/ -race -count=1

      - name: Differential test against the vips CLI
        run: go test ./internal/difftest/ -count=1 -timeout 30m -v

      - name: Memory soak
        run: go test ./internal/soak/ -count=1 -timeout 20m -v


  # The oldest libvips this supports, which is the one that decides whether the
  # version claim in the README is true. Debian 12 carries 8.14 and is supported
  # into 2028, so it is the floor worth holding; Ubuntu 22.04 carries 8.12, and
  # that combination crashes inside libvips during the differential suite with a
  # stack smash, which is not something this binding can paper over.
  test-floor:
    name: test (debian 12, libvips 8.14, the supported floor)
    runs-on: ubuntu-24.04
    container: debian:12
    steps:
      # Runs before checkout on purpose: the base image has no git, and
      # actions/checkout would otherwise fall back to a tarball download.
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates build-essential pkg-config make \
            libvips-dev libvips-tools

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Report the libvips actually linked
        run: |
          pkg-config --modversion vips
          vips --version

      - name: Unit tests
        run: go test ./vips/ -count=1

      - name: Coverage against govips and vipsgen
        run: go test ./internal/coverage/ -count=1 -v

      - name: Differential test against the vips CLI
        run: go test ./internal/difftest/ -count=1 -timeout 30m -v

      - name: Memory soak
        run: go test ./internal/soak/ -count=1 -timeout 20m -v

  # The generator reads the installed libvips, so its output is different on
  # every version above. What has to hold everywhere is that generation
  # succeeds, compiles, and passes the same tests as the committed output.
  generate:
    name: regenerate the typed layer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvips-dev libvips-tools pkg-config

      - name: Regenerate
        run: |
          rm -f vips/zz_generated_*.go
          go run ./cmd/vipsx-gen -out vips

      - name: The regenerated layer must build and pass its tests
        run: |
          gofmt -l vips/zz_generated_ops.go vips/zz_generated_enums.go
          go build ./...
          go test ./vips/ -count=1

      - name: Show what a different libvips changed
        run: git --no-pager diff --stat -- vips/zz_generated_ops.go vips/zz_generated_enums.go || true

  # Reference counting across the cgo boundary is the part of this that cannot
  # be made correct by construction, so it gets a sanitiser rather than an
  # argument.
  #
  # Valgrind was tried here and removed. It cannot read a Go binary: Go's
  # assembly string routines read 32 bytes at a time and mask the tail, which
  # Valgrind reports as an overrun of every short C string; its concurrent
  # collector and stack copying produce hundreds more; and Go's preemption
  # signals collide with Valgrind's own SIGRT32. None of that is a defect in
  # this package, and a check that can never pass is worse than no check.
  # AddressSanitizer understands the cgo boundary and does the same job.
  sanitizers:
    name: ${{ matrix.san }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        san: [asan, leaks]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install libvips and tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvips-dev libvips-tools pkg-config clang

      - name: Address sanitizer
        if: matrix.san == 'asan'
        env:
          CC: clang
          # libvips and GLib pool allocations on purpose; the interesting
          # signals here are invalid reads, writes and double frees.
          ASAN_OPTIONS: detect_leaks=0
        run: go test -asan -count=1 -timeout 30m ./vips/ ./internal/soak/

      # The same build with leak detection on. The suppression file covers the
      # tables GLib and libvips keep for the life of the process; what is left
      # is this package losing a reference it owns.
      # Prove the detector detects, before trusting it to say there is nothing.
      # AddressSanitizer prints nothing when it finds nothing, so a green leak
      # run and a run with leak detection switched off are indistinguishable.
      # This one deliberately loses a hundred allocations and must fail.
      - name: Prove the leak detector actually detects
        if: matrix.san == 'leaks'
        env:
          CC: clang
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: suppressions=.github/lsan.supp:print_suppressions=0
          VIPSX_PROVE_LEAK_CHECK: '1'
        run: |
          if go test -asan -count=1 -run TestLeakDetectorIsWorking ./internal/soak/; then
            echo "::error::leak detection is not active: a deliberate 100 KiB leak went unreported"
            exit 1
          fi
          echo "leak detector confirmed active"

      - name: Leak detection
        if: matrix.san == 'leaks'
        env:
          CC: clang
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: suppressions=.github/lsan.supp:print_suppressions=0
        run: go test -asan -count=1 -timeout 30m ./internal/soak/ -v
